## IniLike example configuration
## Comments must occupy a full line and start with ##.
## Section names, keys, and table names are case-sensitive.

[SERVER]
host = localhost;
port = 8080;
enabled = TRUE;

[DIRECTORIES]
## Paths are returned as text, relative to the caller's chosen base directory.
## Use ./ rather than a single period for the current directory.
data = ./data/;
logs = ./logs/;

[SETTINGS]
name = Example configuration;
maxItems = 100;
timeoutSeconds = 2.5;
## Decimal commas are also supported by numeric getters.
threshold = 1,25;
verbose = FALSE;
## Empty values are allowed.
optionalValue = ;

## Tables contain raw text rows; callers split the columns themselves.
## Columns: name; quantity; status
[TABLE:ITEMS]
first; 10; active;
second; 20; inactive;
third; 5; active;
