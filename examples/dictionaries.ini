## DICT and DICTIONARY contain string keys and string values.
## Numeric-looking values are preserved as text, without type conversion.

[DICT:CHANNELS]
x = 3
y = 3.14
key1 = value1
key2 = acq2.sensor1
str = acq2.sensor3
[END]

[DICTIONARY:UNITS]
voltage = V;
current = A;
temperature = degC;
[END:UNITS]

## A following header or the end of the file can close the block implicitly.
[DICT:EMPTY]

[DICTIONARY:ALIASES]
main = mach1;
acquisition = acq2;
