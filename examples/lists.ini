## LIST and LST contain ordered string items, not parameter dictionaries.

[LST:MACHINES]
mach1;
pil1;
acq2;
[END:MACHINES]

## Equals signs stay inside the item. No key/value parsing is performed.
[LIST:CHANNELS]
x1=mach1.volt1
x2=mach1.current1
x3=acq2.sensor1
x4=acq2.sensor3
x5=pil1.duty
[END]

## Order and repeated items are preserved. The next header ends this list.
[LST:STARTUP_SEQUENCE]
connect;
reset;
reset;
enable;

[LIST:EMPTY]
[END]

[LIST:SHUTDOWN_SEQUENCE]
disable;
disconnect;
## This list ends at the end of the file.
