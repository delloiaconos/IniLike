## TABLE and TBL are equivalent. Each row is returned as one string.
## Callers split columns themselves; blank columns remain in the row.
## Columns: phase; command list; repetitions; converter; next phase; enabled

[TABLE:TEST_PHASES]
WARMUP;WARMUP_COMMANDS;6;conversione_warm.py;;FALSE
STOPPING;STOPPING_COMMANDS;1;conversione_warm.py; ;FALSE
STEPTEST;STEPTEST_COMMANDS;1;conversione_step.py;POSTTEST;TRUE
[END:TEST_PHASES]

[TBL:POSTTEST_PHASES]
COOLDOWN;COOLDOWN_COMMANDS;2;conversione_warm.py;;0
REPORT;REPORT_COMMANDS;1;conversione_step.py;;1
[END]

## No END is needed when another block follows.
[TBL:LIMITS]
voltage;0;48;
current;0;10;

[SEC:TABLE_OPTIONS]
retries = 3;
[END]

## Empty tables are supported.
[TABLE:EMPTY]
[END:EMPTY]
