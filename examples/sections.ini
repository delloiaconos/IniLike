## Equivalent section headers and optional block endings.
## Names and keywords are case-sensitive. Comments occupy a full line.

[SEC:SERVER]
host = localhost;
port = 8080;
enabled = 1;
[END:SERVER]

[SECTION:ACQUISITION]
sampleRate = 1000;
## Both decimal points and decimal commas are supported by numeric getters.
gain = 1,25;
simulation = 0;
[END]

## A new header implicitly ends the preceding section.
[DIRECTORIES]
data = ./data/;
logs = ./logs/;

[SEC:FLAGS]
record = TRUE;
verbose = false;
## The end of the file also ends the section; END is optional.
