## Combined bench configuration: sections, tables and lists.
## Script names and device addresses are illustrative text values.

[SECTION:BENCH]
name = Demo bench;
enabled = 1;
simulation = TRUE;
outputDirectory = ./results/;
[END:BENCH]

## A section, table and list may share the same case-sensitive name.
[SEC:MACHINES]
count = 3;
[END]

[TABLE:MACHINES]
mach1;192.0.2.10;502;
pil1;192.0.2.11;502;
acq2;192.0.2.12;502;
[END:MACHINES]

[LST:MACHINES]
mach1;
pil1;
acq2;
[END]

[LIST:CHANNELS]
x1=mach1.volt1
x2=acq2.sensor1
x3=pil1.duty
[END:CHANNELS]

[LST:WARMUP_COMMANDS]
mach1.enable=1
pil1.duty=0.25
[END]

[LST:STOPPING_COMMANDS]
pil1.duty=0
mach1.enable=0
[END]

## Columns remain raw text; booleans in rows are interpreted by the caller.
[TBL:TEST_PHASES]
WARMUP;WARMUP_COMMANDS;6;conversione_warm.py;;TRUE
STOPPING;STOPPING_COMMANDS;1;conversione_warm.py;;TRUE
[END:TEST_PHASES]
